<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haven Messenger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f3f3f1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: #1f4e6b;
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        body.dark-mode .theme-toggle {
            background: #1d3557;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: #f3f3f1;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #d8dee4;
            border-right: 1px solid #d8dee4;
            transition: all 0.3s ease;
        }

        body.dark-mode .app-container {
            background: #0f172a;
            border-color: #334155;
        }

        .topbar {
            background: linear-gradient(135deg, #1f4e6b 0%, #143a52 100%);
            color: white;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .topbar {
            background: linear-gradient(135deg, #1d3557 0%, #0b1320 100%);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.96);
        }

        .status-icons {
            display: flex;
            gap: 8px;
            font-size: 14px;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
        }

        .back-button {
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .back-button:hover {
            opacity: 1;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .avatar-container {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f4d76b 0%, #d7b96a 100%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-info h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 700;
            color: white;
            letter-spacing: -0.04em;
        }

        .profile-info p {
            font-size: 13px;
            margin: 2px 0 0 0;
            color: rgba(255, 255, 255, 0.72);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .header-actions button:hover {
            opacity: 1;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .privacy-banner {
            margin-top: 20px;
            background: #f4e8bf;
            border: 1px solid rgba(175, 149, 94, 0.4);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #1d2430;
        }

        body.dark-mode .privacy-banner {
            background: #2b3a49;
            border-color: #3a4a5a;
            color: #e2e8f0;
        }

        .privacy-banner-icon {
            font-size: 20px;
            color: #1f4e6b;
            flex-shrink: 0;
            margin-top: 2px;
        }

        body.dark-mode .privacy-banner-icon {
            color: #d7b96a;
        }

        .privacy-banner p {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
        }

        .privacy-banner a {
            color: #1f4e6b;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        body.dark-mode .privacy-banner a {
            color: #d7b96a;
        }

        .date-divider {
            text-align: center;
            color: #6d7a85;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 18px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 999px;
            width: fit-content;
            margin: 0 auto;
        }

        body.dark-mode .date-divider {
            background: rgba(255, 255, 255, 0.06);
            color: #9aa7b6;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.sent {
            justify-content: flex-end;
        }

        .message-row.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 72%;
            padding: 12px 18px;
            border-radius: 24px 24px 8px 24px;
            background: #1f4e6b;
            color: white;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }

        .message-row.received .message-bubble {
            background: #e8edf3;
            color: #1e2a36;
            border-radius: 24px 24px 24px 8px;
        }

        body.dark-mode .message-row.sent .message-bubble {
            background: #1f4e6b;
        }

        body.dark-mode .message-row.received .message-bubble {
            background: #2f3d4d;
            color: #f3f4f6;
        }

        .message-time {
            font-size: 12px;
            color: #7f8d99;
            margin-top: 6px;
            text-align: right;
            padding-right: 8px;
        }

        .message-row.received .message-time {
            text-align: left;
            padding-left: 8px;
            padding-right: 0;
        }

        body.dark-mode .message-time {
            color: #9aa7b6;
        }

        .checkmark {
            font-size: 13px;
            margin-left: 4px;
        }

        .composer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 12px 18px;
            background: #f3f3f1;
            border-top: 1px solid #d8dee4;
            flex-shrink: 0;
        }

        body.dark-mode .composer {
            background: #0f172a;
            border-top-color: #334155;
        }

        .composer-icons {
            display: flex;
            gap: 8px;
        }

        .composer-button {
            background: transparent;
            border: none;
            color: #6d7a85;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        body.dark-mode .composer-button {
            color: #c4ced9;
        }

        .composer-button:hover {
            opacity: 1;
        }

        .input-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #d8dee4;
            border-radius: 999px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
        }

        body.dark-mode .input-container {
            background: #1b2431;
            border-color: #334155;
        }

        .input-container input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: #1e2a36;
        }

        body.dark-mode .input-container input {
            color: #f3f4f6;
        }

        .input-container input::placeholder {
            color: #6d7a85;
        }

        body.dark-mode .input-container input::placeholder {
            color: #9aa7b6;
        }

        .voice-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #d7b96a;
            border: none;
            color: #143a52;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 12px rgba(215, 185, 106, 0.35);
            transition: transform 0.2s;
        }

        .voice-button:hover {
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .app-container {
                max-width: 100%;
                border: none;
            }

            .profile-info h1 {
                font-size: 16px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .theme-toggle {
                top: 10px;
                right: 10px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>

    <div class="app-container">
        <!-- TOPBAR -->
        <div class="topbar">
            <div class="status-bar">
                <span>4:06</span>
                <div class="status-icons">
                    <span>📶</span>
                    <span>📡</span>
                    <span>🔋</span>
                </div>
            </div>

            <div class="chat-header">
                <button class="back-button">←</button>

                <div class="profile-section">
                    <div class="avatar-container">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="Ethan Wright">
                    </div>
                    <div class="profile-info">
                        <h1>Ethan Wright</h1>
                        <p>Last seen a day ago</p>
                    </div>
                </div>

                <div class="header-actions">
                    <button onclick="toggleTheme()" title="Toggle Theme">☀️</button>
                    <button title="More options">⋮</button>
                </div>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area">
            <!-- Privacy Banner -->
            <div class="privacy-banner">
                <div class="privacy-banner-icon">🔒</div>
                <div>
                    <p>Messages are end-to-end encrypted. No one outside of this chat, not even Haven, can read or listen to them. <a href="#">Learn more</a></p>
                </div>
            </div>

            <!-- Date Divider -->
            <div class="date-divider">September 26, 2026</div>

            <!-- Messages -->
            <div class="message-group">
                <div class="message-row sent">
                    <div>
                        <div class="message-bubble">Hi ETHAN</div>
                        <div class="message-time">09:38 PM <span class="checkmark">✓</span></div>
                    </div>
                </div>

                <div class="message-row sent">
                    <div>
                        <div class="message-bubble">Hello</div>
                        <div class="message-time">08:35 PM <span class="checkmark">✓✓</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- COMPOSER -->
        <div class="composer">
            <div class="composer-icons">
                <button class="composer-button" title="Emoji">😊</button>
                <button class="composer-button" title="Attach">📎</button>
            </div>

            <div class="input-container">
                <input type="text" placeholder="Type a message">
            </div>

            <button class="voice-button" title="Voice message">🎤</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const button = document.querySelector('.theme-toggle');
            if (document.body.classList.contains('dark-mode')) {
                button.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                button.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        // Load saved theme on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.querySelector('.theme-toggle').textContent = '☀️';
            }
        });
    </script>
</body>
</html>
